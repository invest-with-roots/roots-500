<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roots — Something went wrong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f5f0;
      color: #1e2a23;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      max-width: 480px;
      width: 100%;
    }

    .leaf {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: block;
    }

    .code {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2f6b4f;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #4a564f;
      margin-bottom: 8px;
    }

    .actions {
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      background: #2f6b4f;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
    }

    .btn:hover {
      background: #275a42;
    }

    .support {
      margin-top: 20px;
      font-size: 14px;
      color: #6b756e;
    }

    .support a {
      color: #2f6b4f;
      text-decoration: none;
      font-weight: 600;
    }

    .support a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="leaf" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#e4ede7"/>
      <path d="M32 46V26M32 26c0-8 6-12 14-12 0 8-6 12-14 12zm0 8c0-6-5-9-11-9 0 6 5 9 11 9z"
            stroke="#2f6b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="code">Error 500</div>
    <h1>Something went wrong on our end</h1>
    <p>We're having a temporary issue serving your request. Our team has been notified and is working on it.</p>
    <p>Please try again in a few minutes.</p>
    <div class="actions">
      <a class="btn" href="https://investwithroots.com">Back to Roots</a>
    </div>
    <p class="support">Still having trouble? Reach us at <a href="mailto:support@investwithroots.com">support@investwithroots.com</a></p>
  </main>
</body>
</html>
