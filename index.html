<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roots — Something went wrong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #212529;
    }

    .container {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 48px;
      min-height: 100vh;
      padding: 32px 0;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-basis: 50%;
      padding: 0 32px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      line-height: 36px;
      font-weight: 600;
    }

    .content p {
      margin-top: 10px;
      font-size: 20px;
      line-height: 28px;
      font-weight: 400;
    }

    .content p a {
      color: #318768;
      text-decoration: none;
    }

    .content p a:hover {
      text-decoration: underline;
    }

    .btn {
      margin: 40px auto;
      padding: 16px 24px;
      max-width: fit-content;
      background: #318768;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
    }

    .image-col {
      display: flex;
      flex-direction: column;
      flex-basis: 50%;
    }

    .image-col img {
      max-width: 100%;
      width: 75%;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        height: 100vh;
        padding: 0;
      }

      .content {
        padding: 0 0 0 80px;
        text-align: left;
      }

      h1 {
        font-size: 48px;
        line-height: 1;
      }

      .btn {
        margin-left: 0;
        font-size: 20px;
      }

      .image-col img {
        width: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Well, this is unexpected</h1>
      <p>The server encountered an error and could not complete your request. Try again later. If the problem persists, please <a href="mailto:investment@investwithroots.com">report your problem</a> and mention this error message and the query that caused it.</p>
      <a class="btn" href="https://app.investwithroots.com/dashboard">Back to Dashboard</a>
    </div>
    <div class="image-col">
      <img src="https://invest-with-roots.github.io/roots-500/rooty_500.gif" alt="Rooty 500" id="rooty-error">
    </div>
  </div>
</body>
</html>
